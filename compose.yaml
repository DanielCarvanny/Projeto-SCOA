name: scoa

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: scoa
      MYSQL_USER: scoa_app
      MYSQL_PASSWORD: ${SCOA_DB_PASSWORD:?Defina SCOA_DB_PASSWORD no arquivo .env}
      MYSQL_ROOT_PASSWORD: ${SCOA_DB_ROOT_PASSWORD:?Defina SCOA_DB_ROOT_PASSWORD no arquivo .env}
      TZ: UTC
    ports:
      - "127.0.0.1:${SCOA_DB_PORT:-3307}:3306"
    volumes:
      - mysql_dados:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mysql_dados:
